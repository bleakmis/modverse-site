<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MODVERSE — Discover the Best Terraria tModLoader Mods</title>
    <meta
      name="description"
      content="MODVERSE is a premium discovery platform for Terraria tModLoader mods: explore, search, compare and favorite the best modifications."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('modverse:theme')
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
